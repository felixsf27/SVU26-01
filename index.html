<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danke, Frau Smok!</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #FFF9F0;
            color: #2d2d2d;
            overflow-x: hidden;
        }

        /* ===== HERO ===== */
        .hero {
            background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 100%);
            padding: 90px 20px 70px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-bg-emoji {
            position: absolute;
            font-size: 220px;
            opacity: 0.08;
            pointer-events: none;
            user-select: none;
        }

        .hero-bg-emoji.left  { top: -30px; left: -30px; }
        .hero-bg-emoji.right { bottom: -40px; right: -30px; }

        .hero h1 {
            font-size: clamp(2.8rem, 9vw, 5.5rem);
            font-weight: 900;
            color: white;
            text-shadow: 3px 4px 0px rgba(0,0,0,0.12);
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .hero .subtitle {
            font-size: clamp(1rem, 3vw, 1.35rem);
            color: rgba(255,255,255,0.92);
            font-weight: 600;
            max-width: 580px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .hero .badge {
            display: inline-block;
            margin-top: 28px;
            background: rgba(255,255,255,0.25);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 100px;
            padding: 8px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            backdrop-filter: blur(4px);
        }

        /* ===== SHARED SECTION ===== */
        .section-inner {
            max-width: 880px;
            margin: 0 auto;
            padding: 70px 24px;
        }

        .section-title {
            font-size: clamp(1.6rem, 4vw, 2.1rem);
            font-weight: 900;
            text-align: center;
            margin-bottom: 36px;
            color: #FF6B6B;
        }

        /* ===== VIDEO ===== */
        .video-section {
            background-color: #ffffff;
            background-image:
                linear-gradient(rgba(100, 149, 237, 0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 149, 237, 0.18) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .video-frame {
            border-radius: 18px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #f3f3f3;
            border: 3px dashed #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }


        /* ===== FOOTER ===== */
        footer {
            background: #2d2d2d;
            color: #888;
            text-align: center;
            padding: 36px 20px;
            font-size: 0.95rem;
        }

        footer .heart {
            color: #FF6B6B;
        }

        /* ===== CONFETTI ===== */
        .confetti-piece {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 9999;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            0%   { transform: translateY(0) rotate(0deg);    opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(600deg); opacity: 0; }
        }

        /* ===== LOGIN ===== */
        #login-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        #login-box {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        #login-box .lock {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        #login-box h2 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #2d2d2d;
            margin-bottom: 8px;
        }

        #login-box p {
            color: #999;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .login-field {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-field:focus {
            border-color: #FF6B6B;
        }

        #login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        #login-btn:hover  { opacity: 0.9; }
        #login-btn:active { transform: scale(0.98); }

        #login-error {
            margin-top: 14px;
            color: #FF6B6B;
            font-weight: 700;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-overlay">
        <div id="login-box">
            <div class="lock">🔒</div>
            <h2>Passwort eingeben</h2>
            <p>Diese Seite ist nur fur eingeladene Gaeste.</p>
            <input class="login-field" id="login-user" type="text" placeholder="Benutzername" autocomplete="username" />
            <input class="login-field" id="login-pass" type="password" placeholder="Passwort" autocomplete="current-password" />
            <button id="login-btn" onclick="checkLogin()">Weiter</button>
            <div id="login-error"></div>
        </div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <span class="hero-bg-emoji left">🎉</span>
        <span class="hero-bg-emoji right">🎊</span>
        <h1>Danke, Frau Smok!</h1>
        <p class="subtitle">Vielen Dank für die vielen Lacher und dafür, dass der Unterricht nie langweilig war.</p>
        <span class="badge">SVU-Kurs Leipzig</span>
    </div>

    <!-- VIDEO -->
    <div class="video-section">
        <div class="section-inner">
            <h2 class="section-title">Unser Video für Sie</h2>
            <div class="video-frame">
                <!-- YouTube-ID hier eintragen, z.B. src="https://www.youtube.com/embed/abc123" -->
                <iframe src="https://www.youtube.com/embed/YOUTUBE_ID" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
        </div>
    </div>


    <!-- FOOTER -->
    <footer>
        <p>Gemacht mit <span class="heart">&#9829;</span> von Ihrem SVU-Kurs 26/01 &middot; Leipzig 2026</p>
    </footer>

    <!-- LOGIN LOGIK -->
    <script>
        // ============================================================
        //  ZUGANGSDATEN HIER ANPASSEN
        //  Einfach die Werte in den Anfuhrungszeichen ersetzen.
        //  Mehrere Nutzer: einfach weitere Zeilen nach gleichem Muster.
        // ============================================================
        const USERS = [
            { name: "smok",   password: "svukurs2026" },   // <- Eintrag 1
            { name: "kurs",   password: "frausmok"    },   // <- Eintrag 2
        ];
        // ============================================================

        // Wenn schon eingeloggt, Overlay direkt verstecken
        if (sessionStorage.getItem('auth') === 'ok') {
            document.getElementById('login-overlay').style.display = 'none';
        }

        function checkLogin() {
            const user = document.getElementById('login-user').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;
            const match = USERS.find(u => u.name === user && u.password === pass);

            if (match) {
                sessionStorage.setItem('auth', 'ok');
                document.getElementById('login-overlay').style.display = 'none';
            } else {
                document.getElementById('login-error').textContent = 'Benutzername oder Passwort falsch.';
                document.getElementById('login-pass').value = '';
                document.getElementById('login-pass').focus();
            }
        }

        // Enter-Taste im Passwortfeld
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('login-pass').addEventListener('keydown', e => {
                if (e.key === 'Enter') checkLogin();
            });
        });
    </script>

    <!-- CONFETTI ON LOAD -->
    <script>
        const confettiColors = ['#FF6B6B', '#FFD93D', '#4ECDC4', '#A29BFE', '#55EFC4', '#FD79A8', '#FDCB6E'];

        function spawnConfetti() {
            const el = document.createElement('div');
            el.className = 'confetti-piece';

            const size = Math.random() * 9 + 6;
            el.style.width  = size + 'px';
            el.style.height = size + 'px';
            el.style.left   = Math.random() * 100 + 'vw';
            el.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
            el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';

            const duration = Math.random() * 2.5 + 2;
            el.style.animationDuration = duration + 's';
            el.style.animationDelay   = (Math.random() * 1.5) + 's';

            document.body.appendChild(el);
            setTimeout(() => el.remove(), (duration + 1.5) * 1000);
        }

        // Initial burst
        for (let i = 0; i < 80; i++) {
            setTimeout(spawnConfetti, i * 40);
        }

        // Light drizzle for a few seconds after
        const drizzle = setInterval(spawnConfetti, 250);
        setTimeout(() => clearInterval(drizzle), 8000);
    </script>

</body>
</html>
